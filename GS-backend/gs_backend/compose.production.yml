name: gs-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-groundstation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  influx-a:
    image: influxdb:2.7-alpine
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_A_USERNAME:-admin-a}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_A_PASSWORD:?Set INFLUX_A_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_A_ORG:-groundstation}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_A_BUCKET:-sat_a}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_A_TOKEN:?Set INFLUX_A_TOKEN in .env}
    volumes:
      - influx_a_data:/var/lib/influxdb2
    ports:
      - "127.0.0.1:8086:8086"
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 5s
      timeout: 3s
      retries: 20

  influx-b:
    image: influxdb:2.7-alpine
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_B_USERNAME:-admin-b}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_B_PASSWORD:?Set INFLUX_B_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_B_ORG:-groundstation}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_B_BUCKET:-sat_b}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_B_TOKEN:?Set INFLUX_B_TOKEN in .env}
    volumes:
      - influx_b_data:/var/lib/influxdb2
    ports:
      - "127.0.0.1:8087:8086"
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: farzanehmajd/gs-backend:1.0.0
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      influx-a:
        condition: service_healthy
      influx-b:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  sync:
    image: farzanehmajd/gs-backend:1.0.0
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      influx-a:
        condition: service_healthy
      influx-b:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["sh", "-c", "sleep 10 && python -m app.sync"]

  frontend:
    image: farzanehmajd/gs-frontend:1.0.0
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  influx_a_data:
  influx_b_data:
